<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mom's Minivan Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column — headline, one large viewer panel, a short user guide list */
:root{
  --bg:#FFFFFF; --panel:#F5F5F7; --ink:#1D1D1F; --muted:#6E6E73; --line:#D2D2D7; --link:#0066CC;
  --glass:rgba(255,255,255,.74); --glass-line:rgba(0,0,0,.06); --on:#1D1D1F; --on-ink:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --panel:#161617; --ink:#F5F5F7; --muted:#86868B; --line:#333336; --link:#2997FF;
  --glass:rgba(40,40,42,.74); --glass-line:rgba(255,255,255,.08); --on:#F5F5F7; --on-ink:#1D1D1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#161617; --ink:#F5F5F7; --muted:#86868B; --line:#333336; --link:#2997FF;
  --glass:rgba(40,40,42,.74); --glass-line:rgba(255,255,255,.08); --on:#F5F5F7; --on-ink:#1D1D1F; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.wrap{max-width:1024px;margin:0 auto;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));padding-block:72px 48px;display:grid;gap:32px}

h1{margin:0;font-size:clamp(44px,8.5vw,88px);line-height:1.03;font-weight:600;letter-spacing:-.035em;text-wrap:balance}
h1 span{color:var(--muted)}
h2{margin:24px 0 0;font-size:clamp(28px,4.4vw,40px);line-height:1.1;font-weight:600;letter-spacing:-.028em;text-wrap:balance}

.viewer{position:relative;height:clamp(420px,70vh,700px);max-width:100%;border-radius:28px;background:var(--panel);overflow:hidden}
.viewer canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:24px}
.glass{background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--glass-line)}
.seg{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:999px}
.seg button{border:0;background:none;padding:10px 22px;border-radius:999px;font-size:15px;font-weight:500;cursor:pointer;transition:background .3s,color .3s;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
@media (max-width:420px){.seg button{padding:10px 16px}}

.hs{position:absolute;left:0;top:0;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 2px 10px rgba(0,0,0,.18);display:grid;place-items:center;transition:opacity .35s}
.hs svg{width:14px;height:14px;stroke:var(--ink);stroke-width:2.4;fill:none;transition:transform .3s}
.hs.on svg{transform:rotate(45deg)}
.hs.off{opacity:0;pointer-events:none}

.card{position:absolute;left:18px;top:18px;width:min(320px,calc(100% - 36px));border-radius:22px;padding:20px 22px;display:grid;gap:6px;transition:opacity .3s,transform .3s}
.card.hide{opacity:0;transform:translateY(-8px);pointer-events:none}
.card h3{margin:0;font-size:21px;font-weight:600;letter-spacing:-.02em;padding-right:28px}
.card p{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
.card .x{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;border:0;background:var(--line);cursor:pointer;display:grid;place-items:center}
.card .x svg{width:10px;height:10px;stroke:var(--ink);stroke-width:2.4}

.paints{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:-8px}
.paints span{font-size:14px;color:var(--muted);min-width:8.5em}
.dot{width:26px;height:26px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);position:relative}
.dot[aria-pressed="true"]::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--ink)}
.list{display:grid;border-top:1px solid var(--line)}
.item{border-bottom:1px solid var(--line)}
.item button{width:100%;display:flex;align-items:center;gap:16px;border:0;background:none;padding:22px 0;cursor:pointer;text-align:left;font-size:21px;font-weight:600;letter-spacing:-.02em}
.item button span{margin-left:auto;font-size:14px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.item svg{width:14px;height:14px;stroke:var(--ink);stroke-width:2.2;fill:none;flex:none;transition:transform .3s}
.item button[aria-expanded="true"] svg{transform:rotate(45deg)}
.item ol{margin:0;padding:0 0 22px 1.2em;color:var(--muted);display:grid;gap:6px;max-width:60ch}
footer{color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <h1>Mom's Minivan. <span>Everything you need to know, right where it is.</span></h1>

  <div class="viewer" id="viewer">
    <canvas id="gl" aria-label="3D model of the van"></canvas>
    <div id="hsl"></div>
    <div class="card glass hide" id="card" aria-live="polite">
      <button class="x" id="cardX" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8"/></svg></button>
      <h3 id="cardT"></h3><p id="cardP"></p>
    </div>
    <div class="seg glass" id="seg" role="group" aria-label="View"></div>
  </div>
  <div class="paints" id="paints" role="group" aria-label="Paint color"><span id="paintName"></span></div>

  <h2>A user guide for your new car.</h2>
  <div class="list" id="list"></div>

  <footer>Instructions are sample content.</footer>
</div>

<script src="three.min.js"></script>
<script src="RoomEnvironment.js"></script>
<script>
const $=s=>document.querySelector(s);
const PLUS='<svg viewBox="0 0 14 14"><path d="M7 1v12M1 7h12"/></svg>';

const VIEWS={
 front:{label:"Front",pos:[4.4,1.8,6.0],target:[0,0.95,0.1],fov:30,ext:true},
 side:{label:"Side",pos:[8.2,1.2,0],target:[0,0.95,0],fov:30,ext:true},
 interior:{label:"Interior",pos:[0.05,1.78,0.15],target:[0.15,1.05,2.4],fov:56,ext:false}
};
const HOTSPOTS=[
 {view:"front",p:[0.6,0.86,2.37],t:"Headlights",d:"Turn the end of the left stalk to AUTO and the lights come on by themselves at dusk."},
 {view:"front",p:[0.4,1.36,2.37],t:"Wipers",d:"Push the right stalk down once for a single wipe. Pull it toward you to spray washer fluid."},
 {view:"front",p:[0.9,0.34,1.35],t:"Tires",d:"Keep them at 240 kPa. The recommended pressure is on the label inside the driver's door."},
 {view:"side",p:[1.08,1.32,1.95],t:"Mirrors",d:"Use the small joystick on the driver's door to adjust them. They fold in when you lock the car."},
 {view:"side",p:[0.94,0.82,0.25],t:"Sliding door",d:"Pull the chrome handle out, then slide the door back until it latches open."},
 {view:"side",p:[0.94,1.0,-1.7],t:"Fuel door",d:"Press the fuel door while the car is unlocked. Use regular unleaded. The tank holds 70 liters."},
 {view:"interior",p:[0.21,1.31,1.6],t:"Steering wheel",d:"The stalk on the left sets cruise control. The horn is in the chrome center."},
 {view:"interior",p:[0.62,1.18,1.79],t:"Driver display",d:"Shows your speed, fuel and any warning lights. Amber means check soon; red means stop when it's safe."},
 {view:"interior",p:[0,1.1,1.83],t:"Climate controls",d:"Turn the outer knobs to set the temperature. The middle knob sets the fan speed."}
];
const GUIDE=[
 {t:"Fill up the tank",dur:"3 min",s:["Turn off the engine and unlock the car.","Press the fuel door on the driver's side to open it.","Use regular unleaded. Stop when the pump clicks off."]},
 {t:"Check tire pressure",dur:"2 min",s:["Check when the tires are cold, before driving.","Press a gauge onto each valve and read the pressure.","Add air until each tire reads 240 kPa."]},
 {t:"Fold the third row",dur:"1 min",s:["Open the rear hatch.","Pull the strap on the back of the third-row seat.","Push the seatback forward and down into the floor well."]},
 {t:"Use cruise control",dur:"2 min",s:["Reach the speed you want on the highway.","Press SET on the left side of the steering wheel.","Tap the brake or press CANCEL to turn it off."]}
];

/* ---------- scene ---------- */
const viewer=$("#viewer"),canvas=$("#gl");
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});}
catch(e){viewer.insertAdjacentHTML("beforeend",'<div class="msg">This browser can\'t show 3D graphics. Try another browser or device.</div>');throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.physicallyCorrectLights=true;
renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new THREE.RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(30,1,0.01,100);

const M={
 lower:new THREE.MeshPhysicalMaterial({color:0xD9963E,metalness:0.15,roughness:0.35,clearcoat:1,clearcoatRoughness:0.1,clippingPlanes:[new THREE.Plane(new THREE.Vector3(0,-1,0),1.2)]}),
 upper:new THREE.MeshPhysicalMaterial({color:0xF1EADA,metalness:0.1,roughness:0.35,clearcoat:1,clearcoatRoughness:0.1,clippingPlanes:[new THREE.Plane(new THREE.Vector3(0,1,0),-1.2)]}),
 cream:new THREE.MeshPhysicalMaterial({color:0xF1EADA,metalness:0.1,roughness:0.35,clearcoat:1}),
 glass:new THREE.MeshPhysicalMaterial({color:0x0E1820,metalness:0,roughness:0.04,clearcoat:1,transparent:true,opacity:0.85,side:THREE.DoubleSide,depthWrite:false,clippingPlanes:[new THREE.Plane(new THREE.Vector3(0,-1,0),1.8),new THREE.Plane(new THREE.Vector3(0,1,0),-1.3)]}),
 chrome:new THREE.MeshStandardMaterial({color:0xE3E6E8,metalness:1,roughness:0.12}),
 hub:new THREE.MeshStandardMaterial({color:0xE8EAEC,metalness:0.55,roughness:0.22}),
 trim:new THREE.MeshStandardMaterial({color:0x2A2C30,roughness:0.6}),
 black:new THREE.MeshStandardMaterial({color:0x0E0F11,roughness:0.5}),
 tire:new THREE.MeshStandardMaterial({color:0x151617,roughness:0.85}),
 white:new THREE.MeshStandardMaterial({color:0xF4F2EC,roughness:0.6}),
 head:new THREE.MeshStandardMaterial({color:0xFFFFFF,emissive:0xFFF3DC,emissiveIntensity:0.7,roughness:0.1}),
 tail:new THREE.MeshStandardMaterial({color:0x9A1418,emissive:0x6A0A10,emissiveIntensity:0.8,roughness:0.2}),
 cabin:new THREE.MeshStandardMaterial({color:0xD8CDB8,roughness:0.9,side:THREE.DoubleSide}),
 roofLiner:new THREE.MeshStandardMaterial({color:0xE6DED0,emissive:0x8A847A,roughness:0.95,side:THREE.DoubleSide}),
 dash:new THREE.MeshStandardMaterial({color:0xE9E1D0,roughness:0.6}),
 seat:new THREE.MeshStandardMaterial({color:0x8A5A3B,roughness:0.7}),
 floor:new THREE.MeshStandardMaterial({color:0x3A3631,roughness:1})
};
renderer.localClippingEnabled=true;
const PAINTS=[["Butterscotch","#D9963E"],["Sky Blue","#7FA7C9"]];
function setPaint(i){M.lower.color.set(PAINTS[i][1]);$("#paintName").textContent=PAINTS[i][0]+" and Cream";document.querySelectorAll(".dot").forEach((d,j)=>d.setAttribute("aria-pressed",String(j===i)));}
PAINTS.forEach(([n,c],i)=>{const b=document.createElement("button");b.className="dot";b.style.background=`linear-gradient(180deg,#F1EADA 50%,${c} 50%)`;b.setAttribute("aria-label",n+" and Cream");b.onclick=()=>setPaint(i);$("#paints").insertBefore(b,$("#paintName"));});
setTimeout(()=>setPaint(0));
const car=new THREE.Group();scene.add(car);
function add(geo,mat,x,y,z,rx=0,ry=0,rz=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);car.add(m);return m;}
function box(w,h,d,mat,x,y,z,rx=0){return add(new THREE.BoxGeometry(w,h,d),mat,x,y,z,rx);}
function cyl(r,len,mat,x,y,z,axis){const g=new THREE.CylinderGeometry(r,r,len,40);const m=add(g,mat,x,y,z);if(axis==="x")m.rotation.z=Math.PI/2;if(axis==="z")m.rotation.x=Math.PI/2;return m;}

// rounded side profile, extruded across the width with a soft bevel (front points to +z)
function vanShape(){const s=new THREE.Shape();
 s.moveTo(-2.1,0.32);s.lineTo(-1.83,0.32);s.absarc(-1.35,0.34,0.48,Math.PI,0,true);s.lineTo(0.87,0.32);s.absarc(1.35,0.34,0.48,Math.PI,0,true);
 s.lineTo(2.05,0.32);s.quadraticCurveTo(2.2,0.32,2.2,0.5);s.lineTo(2.22,1.25);s.bezierCurveTo(2.24,1.75,2.1,1.95,1.6,1.96);
 s.lineTo(-1.6,1.96);s.bezierCurveTo(-2.1,1.95,-2.2,1.75,-2.2,1.3);s.lineTo(-2.2,0.5);s.quadraticCurveTo(-2.2,0.32,-2.1,0.32);return s;}
function glassShape(){const s=new THREE.Shape();
 s.moveTo(-2.2,1.25);s.lineTo(2.22,1.25);s.bezierCurveTo(2.24,1.75,2.1,1.95,1.6,1.96);s.lineTo(-1.6,1.96);s.bezierCurveTo(-2.1,1.95,-2.2,1.75,-2.2,1.3);s.closePath();return s;}
function extrude(shape,depth,bevel){const g=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel,bevelSegments:8,curveSegments:40});g.translate(0,0,-depth/2);g.rotateY(-Math.PI/2);g.computeVertexNormals();return g;}
const bodyGeo=extrude(vanShape(),1.6,0.12);
car.add(new THREE.Mesh(bodyGeo,M.lower));car.add(new THREE.Mesh(bodyGeo,M.upper));
const glass=new THREE.Mesh(extrude(glassShape(),1.6,0.135),M.glass);glass.renderOrder=2;car.add(glass);

// window frames in the upper color: split windshield, side pillars, rear corners
box(0.07,0.52,0.05,M.cream,0,1.55,2.355);
for(const sx of [1,-1]){
  for(const z of [1.62,0.62,-0.38,-1.38]) box(0.04,0.52,0.12,M.cream,sx*0.935,1.55,z);
  box(0.012,0.012,4.3,M.chrome,sx*0.925,1.2,0);                    // chrome beltline
  box(0.012,0.7,0.01,M.trim,sx*0.925,0.82,0.95);                   // door seams
  box(0.012,0.7,0.01,M.trim,sx*0.925,0.82,-0.45);
  box(0.03,0.04,0.16,M.chrome,sx*0.94,1.0,0.75);                   // sliding door handle
  // round headlight in a chrome ring
  cyl(0.115,0.04,M.head,sx*0.6,0.86,2.335,"z");
  add(new THREE.TorusGeometry(0.12,0.018,12,40),M.chrome,sx*0.6,0.86,2.35);
  cyl(0.06,0.03,M.tail,sx*0.7,0.95,-2.335,"z");                      // round tail light
  add(new THREE.TorusGeometry(0.065,0.012,10,32),M.chrome,sx*0.7,0.95,-2.35);
  // mirror on a stalk
  box(0.16,0.02,0.02,M.chrome,sx*0.98,1.28,1.95);
  add(new THREE.SphereGeometry(0.07,24,16),M.chrome,sx*1.07,1.32,1.95).scale.set(0.5,1,1.1);
  // wheels: tire, whitewall, chrome hubcap
  for(const wz of [1.35,-1.35]){
    cyl(0.34,0.22,M.tire,sx*0.78,0.34,wz,"x");
    cyl(0.26,0.225,M.white,sx*0.78,0.34,wz,"x");
    cyl(0.19,0.23,M.tire,sx*0.78,0.34,wz,"x");
    add(new THREE.SphereGeometry(0.17,32,16,0,Math.PI*2,0,Math.PI/2),M.hub,sx*0.89,0.34,wz,0,0,-Math.PI/2).scale.set(1,0.35,1);
  }
}
box(0.01,0.16,0.16,M.lower,0.93,1.0,-1.7);                         // fuel door
// chrome bumpers (rounded)
add(new THREE.CapsuleGeometry(0.075,1.55,8,20),M.chrome,0,0.42,2.36,0,0,Math.PI/2);
add(new THREE.CapsuleGeometry(0.075,1.55,8,20),M.chrome,0,0.42,-2.34,0,0,Math.PI/2);

// cabin
box(1.6,0.04,4.0,M.floor,0,0.5,0);
for(const sx of [1,-1]) box(0.03,0.72,4.0,M.cabin,sx*0.8,0.88,0);
box(1.6,0.02,4.0,M.roofLiner,0,1.9,0);
box(1.6,0.7,0.04,M.cabin,0,0.86,2.16);
box(1.6,0.26,0.3,M.dash,0,1.12,2.0);
box(0.42,0.16,0.08,M.trim,0.4,1.18,1.84);
function screen(w,h,draw,x,y,z,rx){const c=document.createElement("canvas");c.width=512;c.height=Math.round(512*h/w);const g=c.getContext("2d");draw(g,c.width,c.height);const tx=new THREE.CanvasTexture(c);tx.encoding=THREE.sRGBEncoding;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tx,toneMapped:false}));m.position.set(x,y,z);m.rotation.set(rx,Math.PI,0);car.add(m);}
const SANS='-apple-system,BlinkMacSystemFont,"Inter",Arial,sans-serif';
screen(0.36,0.12,(g,w,h)=>{g.fillStyle="#F4EEDF";g.fillRect(0,0,w,h);g.strokeStyle="#2A2C30";g.lineWidth=6;g.beginPath();g.arc(w*0.3,h*0.95,h*0.75,Math.PI*1.1,Math.PI*1.9);g.stroke();
  g.strokeStyle="#C0392B";g.lineWidth=5;g.beginPath();g.moveTo(w*0.3,h*0.95);g.lineTo(w*0.18,h*0.4);g.stroke();g.fillStyle="#2A2C30";g.font=`22px ${SANS}`;g.textAlign="center";g.fillText("km/h",w*0.3,h*0.85);
  g.fillText("FUEL",w*0.75,h*0.3);g.fillStyle="#D7CDBA";g.fillRect(w*0.6,h*0.5,w*0.3,12);g.fillStyle="#2A2C30";g.fillRect(w*0.6,h*0.5,w*0.22,12);},0.4,1.18,1.799,0);
for(const kx of [-0.12,0,0.12]) cyl(0.03,0.03,M.chrome,kx,1.1,1.84,"z");


// steering wheel: tilted toward the dashboard, column running down into the dash
{const sw=new THREE.Group();sw.position.set(0.4,1.3,1.6);sw.rotation.x=0.64;car.add(sw);
 sw.add(new THREE.Mesh(new THREE.TorusGeometry(0.19,0.02,16,64),M.cream));
 const hb=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.055,0.05,24),M.chrome);hb.rotation.x=Math.PI/2;hb.position.z=0.01;sw.add(hb);
 for(const a of [0,Math.PI*2/3,Math.PI*4/3]){const sp=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.018,0.012),M.chrome);sp.position.set(Math.cos(a+Math.PI/2)*0.115,Math.sin(a+Math.PI/2)*-0.115,0.01);sp.rotation.z=-(a+Math.PI/2);sw.add(sp);}
 const col=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.03,0.34,16),M.trim);col.rotation.x=Math.PI/2;col.position.z=0.19;sw.add(col);}
function seat(x,z,w){box(w,0.14,0.52,M.seat,x,0.72,z);box(w,0.68,0.12,M.seat,x,1.08,z-0.3,-0.12);}
seat(0.4,0.95,0.5);seat(-0.4,0.95,0.5);seat(0,-0.15,1.4);seat(0,-1.3,1.4);

// soft contact shadow
(function(){const c=document.createElement("canvas");c.width=c.height=256;const g=c.getContext("2d");const r=g.createRadialGradient(128,128,10,128,128,128);r.addColorStop(0,"rgba(0,0,0,.5)");r.addColorStop(.6,"rgba(0,0,0,.2)");r.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=r;g.fillRect(0,0,256,256);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(2.7,5.8),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.y=0.003;scene.add(m);})();

/* ---------- views ---------- */
const cur={pos:new THREE.Vector3(),target:new THREE.Vector3(),fov:30},from={pos:new THREE.Vector3(),target:new THREE.Vector3(),fov:30};
let view="front",t0=0,dur=0;
function goal(v){const V=VIEWS[v],pos=new THREE.Vector3(...V.pos),target=new THREE.Vector3(...V.target);
  if(V.ext){const k=Math.max(1,1.45/camera.aspect);pos.sub(target).multiplyScalar(k).add(target);}return{pos,target,fov:V.fov};}
function setView(v,instant){view=v;from.pos.copy(cur.pos);from.target.copy(cur.target);from.fov=cur.fov;t0=performance.now();dur=instant?0:1300;
  document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));closeCard();}
Object.entries(VIEWS).forEach(([k,V])=>{const b=document.createElement("button");b.textContent=V.label;b.dataset.v=k;b.onclick=()=>setView(k);$("#seg").appendChild(b);});
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---------- hotspots ---------- */
const hs=HOTSPOTS.map((h,i)=>{const el=document.createElement("button");el.className="hs off";el.innerHTML=PLUS;el.setAttribute("aria-label",h.t);el.onclick=()=>openCard(i);$("#hsl").appendChild(el);return{...h,el,v3:new THREE.Vector3(...h.p)};});
let open=-1;
function openCard(i){if(open===i)return closeCard();open=i;$("#cardT").textContent=HOTSPOTS[i].t;$("#cardP").textContent=HOTSPOTS[i].d;$("#card").classList.remove("hide");hs.forEach((x,j)=>x.el.classList.toggle("on",j===i));}
function closeCard(){open=-1;$("#card").classList.add("hide");hs.forEach(x=>x.el.classList.remove("on"));}
$("#cardX").onclick=closeCard;addEventListener("keydown",e=>{if(e.key==="Escape")closeCard()});

/* ---------- guide ---------- */
$("#list").innerHTML=GUIDE.map((h,i)=>`<div class="item"><button aria-expanded="false" aria-controls="g${i}">${h.t}<span>${h.dur}</span>${PLUS}</button><ol id="g${i}" hidden>${h.s.map(x=>`<li>${x}</li>`).join("")}</ol></div>`).join("");
document.querySelectorAll(".item button").forEach(b=>b.onclick=()=>{const o=b.getAttribute("aria-expanded")!=="true";b.setAttribute("aria-expanded",String(o));b.nextElementSibling.hidden=!o;});

/* ---------- size + loop ---------- */
let W=0,H=0;
function resize(){const r=viewer.getBoundingClientRect();W=r.width;H=r.height;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(viewer);resize();
const g0=goal("front");cur.pos.copy(g0.pos);cur.target.copy(g0.target);cur.fov=g0.fov;setView("front",true);
const tmp=new THREE.Vector3();
function frame(now){
  const g=goal(view),t=dur?Math.min(1,(now-t0)/dur):1,k=ease(t);
  cur.pos.lerpVectors(from.pos,g.pos,k);cur.target.lerpVectors(from.target,g.target,k);cur.fov=from.fov+(g.fov-from.fov)*k;
  camera.position.copy(cur.pos);camera.lookAt(cur.target);camera.fov=cur.fov;camera.updateProjectionMatrix();
  const inside=Math.abs(camera.position.x)<0.85&&camera.position.y<1.9&&Math.abs(camera.position.z)<2.2;
  M.glass.opacity=inside?0.22:0.86;
  renderer.render(scene,camera);
  hs.forEach(h=>{const p=tmp.copy(h.v3).project(camera);const show=h.view===view&&t>=1&&p.z<1&&Math.abs(p.x)<1&&Math.abs(p.y)<1;
    h.el.style.left=((p.x*.5+.5)*W)+"px";h.el.style.top=((-p.y*.5+.5)*H)+"px";h.el.classList.toggle("off",!show);h.el.tabIndex=show?0:-1;});
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>

</body>
</html>
